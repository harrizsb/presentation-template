title: "Neutral Beamer"
author: "Presentation Template Team"
contributor: "Neutral template contributors"
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    beamer:
      theme: metropolis
      aspectratio: 43
      fontsize: 11pt
      section-titles: true
      numbersections: true
      navigation: empty
      pdf-engine: xelatex
      include-in-header: header.tex
      include-before-body: before-body.tex
